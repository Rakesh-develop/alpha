<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGMA – Login</title>
<link rel="stylesheet" href="/static/style.css">
<style>
 .shell{min-height:100vh;display:grid;place-items:center;padding:16px}
 .box{width:100%;max-width:380px}
 .logo{text-align:center;margin-bottom:22px}
 .logo .brand{font-size:34px}
 .logo p{margin:6px 0 0;color:var(--muted);font-size:14px}
</style></head>
<body><div class="shell"><div class="box">
  <div class="logo"><div class="brand">SIG<b>M</b>A</div><p>Employee attendance</p></div>
  <form class="card" id="f" autocomplete="on">
    <label for="u">User ID</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button class="block" id="go" type="submit" style="margin-top:6px">Log in</button>
  </form>
</div></div>
<script>
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const go=document.getElementById('go'), err=document.getElementById('err');
  go.disabled=true; err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:u.value,password:p.value})});
    const d=await r.json();
    if(r.ok) location.href='/home'; else err.textContent=d.error||'Login failed';
  }catch(x){err.textContent='Cannot reach server.'}
  go.disabled=false;
});
</script></body></html>
